<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaTeX 文档生成器</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <h1>📄 LaTeX 文档生成器</h1>
  <div class="topbar-right">
    <div id="health" class="health">正在检测环境…</div>
    <button id="btn-settings" class="ghost small" title="配置智谱 API Key">🔑 设置</button>
    <button id="btn-shutdown" class="ghost small" title="停止后台服务（无窗口启动时用）">⏻ 退出服务</button>
  </div>
</header>

<main class="layout">
  <aside class="panel side">
    <label class="field-label" for="doc-type">文档类型</label>
    <select id="doc-type"></select>

    <label class="field-label" for="prompt">需求描述</label>
    <textarea id="prompt" rows="9"
      placeholder="例如：帮我写一份《线性代数》期末复习笔记，中文，包含行列式、矩阵的秩、线性方程组三章；每章先总结知识点，再给 2 道例题和详细解答。"></textarea>

    <div id="pdf2tex-box">
      <button id="btn-pdf2tex" class="ghost wide">🔁 PDF 转 LaTeX（AI 近似重建，结果仅供格式参考）</button>
      <input type="file" id="pdf2tex-input" accept=".pdf" hidden />
    </div>

    <div id="drop-zone">
      <button id="btn-pick" class="ghost wide">📎 添加附件（.tex 格式示范 · .txt/.md/.pdf 知识来源 · 图片）</button>
      <input type="file" id="file-input" multiple hidden
        accept=".tex,.txt,.md,.markdown,.pdf,.png,.jpg,.jpeg,.webp" />
    </div>
    <div id="file-list"></div>
    <div class="btn-row">
      <button id="btn-generate" class="primary">生成 PDF</button>
      <button id="btn-cancel" class="ghost" hidden>取消</button>
    </div>

    <ol class="steps" id="steps">
      <li data-step="generate"><span class="dot"></span>生成 LaTeX</li>
      <li data-step="compile"><span class="dot"></span>编译 PDF</li>
      <li data-step="fix" hidden><span class="dot"></span>自动修复 <em id="fix-round"></em></li>
      <li data-step="done"><span class="dot"></span>完成</li>
    </ol>
    <div id="status" class="status"></div>
  </aside>

  <section class="panel main">
    <nav class="tabs">
      <button class="tab active" data-tab="pdf">PDF 预览</button>
      <button class="tab" data-tab="code">LaTeX 源码</button>
      <button class="tab" data-tab="log" id="log-tab" hidden>编译日志</button>
      <button class="tab" data-tab="hist">🕘 历史</button>
    </nav>

    <div class="page active" id="page-pdf">
      <div class="toolbar">
        <a id="btn-download" class="btn" hidden download="document.pdf">⬇ 下载 PDF</a>
        <a id="btn-tex-dl" class="btn" hidden download="converted.tex">⬇ 下载 .tex</a>
        <button id="btn-copy" class="btn" hidden>复制源码</button>
        <button id="btn-recompile" class="btn primary-btn" hidden>重新编译</button>
        <button id="btn-use-format" class="btn" hidden>用作格式示范</button>
      </div>
      <embed id="pdf-view" type="application/pdf" hidden />
      <div id="pdf-empty" class="placeholder">生成完成后，PDF 会显示在这里</div>
    </div>

    <div class="page" id="page-code">
      <textarea id="code" spellcheck="false" readonly
        placeholder="模型生成的 LaTeX 源码会实时显示在这里…"></textarea>
    </div>

    <div class="page" id="page-log">
      <pre id="log">编译日志会显示在这里。</pre>
    </div>

    <div class="page" id="page-hist">
      <div class="hist-toolbar">
        <button id="btn-hist-refresh" class="btn">↻ 刷新</button>
        <span class="hist-note">点击条目回看源码与 PDF；✕ 删除记录及其文件</span>
      </div>
      <ul id="history" class="history"><li class="hist-empty">暂无记录</li></ul>
    </div>
  </section>
</main>

<div id="modal-mask" class="modal-mask" hidden>
  <div class="modal">
    <h3>🔑 API Key 设置</h3>
    <p class="cfg-line">当前状态：<span id="cfg-current" class="cfg-current">…</span></p>
    <ol class="cfg-steps">
      <li>打开 <a href="https://open.bigmodel.cn" target="_blank" rel="noopener">open.bigmodel.cn</a> 并注册 / 登录</li>
      <li>右上角「控制台」→「API Keys」→「创建 API Key」并复制</li>
      <li>把 Key 粘贴到下面保存（立即生效，无需重启；只存本机 .env）</li>
    </ol>
    <input id="cfg-key" type="text" spellcheck="false" placeholder="粘贴新的 API Key" />
    <p id="cfg-error" class="cfg-error" hidden></p>
    <div class="modal-btns">
      <button id="cfg-cancel" class="ghost">取消</button>
      <button id="cfg-save" class="primary">保存</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
